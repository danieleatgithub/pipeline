plugins {
    id 'groovy'
    id 'maven-publish'
    id 'idea'
}
def getGitHash = {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception e) {
        return "unknown"
    }
}

group = 'org.home'
version = "1.0.0-${getGitHash()}"

repositories {
    mavenCentral()
}

dependencies {
    implementation localGroovy()

    // Ultima versione stabile di Spock (variante per Groovy 3.0)
    testImplementation 'org.spockframework:spock-core:2.4-groovy-3.0'

    // Dipendenze ausiliarie aggiornate per il mocking
    testRuntimeOnly 'net.bytebuddy:byte-buddy:1.15.11'
    testRuntimeOnly 'org.objenesis:objenesis:3.4'

    // JUnit 5 (necessario come runtime per Spock 2.x)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


idea {
    module {
        sourceDirs += file('vars')
    }
}

sourceSets {
    main {
        groovy {
            srcDirs = ['src/', 'vars']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        groovy {
            srcDirs = ['test/']
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'jenkins-shared-lib'
            from components.java
        }
    }
}

